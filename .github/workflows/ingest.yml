name: Ingest Content via Webhook

on:
  repository_dispatch:
    types: [ingest]
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON payload forwarded to ingest:webhook as MESSAGE"
        required: true
        type: string

concurrency:
  group: ingestion
  cancel-in-progress: false
  queue: max

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  ingestWebhook:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Find and checkout latest updated branch
        id: brancher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_BRANCH=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --json headRefName,updatedAt \
            --jq 'sort_by(.updatedAt) | reverse | .[] | select(.headRefName | startswith("automated-")) | .headRefName' \
            | head -n 1)
          if [[ -z "$LATEST_BRANCH" ]]; then
            BRANCH_NAME="main"
          else
            BRANCH_NAME=$LATEST_BRANCH
          fi
          echo "Latest updated branch: $BRANCH_NAME"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin main
          REMOTE_HEAD=""
          if [[ "$BRANCH_NAME" = "main" ]]; then
            git checkout -B main origin/main
          else
            git fetch origin "$BRANCH_NAME"
            REMOTE_HEAD=$(git rev-parse "origin/$BRANCH_NAME")
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
            git rebase origin/main
          fi
          echo "remote-head=$REMOTE_HEAD" >> "$GITHUB_OUTPUT"
          echo "latest-branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build ingest payload
        id: ingest-payload
        env:
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ inputs.payload }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PAYLOAD="$MANUAL_PAYLOAD"
          else
            PAYLOAD="$DISPATCH_PAYLOAD"
          fi

          echo "$PAYLOAD" | jq -e . >/dev/null
          {
            echo 'message<<EOF'
            echo "$PAYLOAD"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - run: npm run ingest:webhook
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MESSAGE: ${{ steps.ingest-payload.outputs.message }}
      - run: npm run data:validate
      - name: Check for changes
        id: make-changes
        env:
          LATEST_BRANCH: ${{ steps.brancher.outputs.latest-branch }}
        run: |-
          if [[ -n $(git status --porcelain) || "$LATEST_BRANCH" != "main" ]]; then
            echo "Validate new data or the existing automated PR, including a rebase-only update"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "Working directory is clean"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
      - name: Validate automated changes before merging
        if: steps.make-changes.outputs.has_changes == 'true'
        run: bash scripts/validate-ingest.sh
      - name: Target branch
        if: steps.make-changes.outputs.has_changes == 'true'
        id: target-branch
        run: |-
          if [[ "${{ steps.brancher.outputs.latest-branch }}" = "main" ]]; then
            echo "branch-name=automated-${{ github.run_id }}" >> $GITHUB_OUTPUT
          else
            echo "branch-name=${{ steps.brancher.outputs.latest-branch }}" >> $GITHUB_OUTPUT
          fi

      - name: Push changes
        if: steps.make-changes.outputs.has_changes == 'true'
        id: push-changes
        env:
          BRANCH_NAME: ${{ steps.target-branch.outputs.branch-name }}
          LATEST_BRANCH: ${{ steps.brancher.outputs.latest-branch }}
          REMOTE_HEAD: ${{ steps.brancher.outputs.remote-head }}
        run: |-
          if [[ "$LATEST_BRANCH" = "main" ]]; then
            git checkout -b "$BRANCH_NAME"
            REMOTE_HEAD=""
          fi
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): automated changes"
          fi
          git push --force-with-lease="refs/heads/$BRANCH_NAME:$REMOTE_HEAD" origin "HEAD:refs/heads/$BRANCH_NAME"
          echo "head-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create Pull Request
        if: steps.make-changes.outputs.has_changes == 'true' && steps.brancher.outputs.latest-branch == 'main'
        uses: actions/github-script@v9
        with:
          script: |
            const branchName = '${{ steps.target-branch.outputs.branch-name }}';

            const { data: pullRequest } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore(data): automated ingest`,
              body: `
              # Automated data

              This PR was created by the ingest workflow after data validation and deterministic checks passed.
              `,
              head: branchName,
              base: 'main'
            });

            console.log(`Pull Request created: ${pullRequest.html_url}`);

      - name: Merge validated pull request
        if: steps.make-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.target-branch.outputs.branch-name }}
          HEAD_SHA: ${{ steps.push-changes.outputs.head-sha }}
        run: |
          for attempt in 1 2 3; do
            git fetch origin main "$BRANCH_NAME"
            if [[ $(git rev-parse "origin/$BRANCH_NAME") != "$HEAD_SHA" ]]; then
              echo "Remote PR head changed; stopping to preserve concurrent edits."
              exit 1
            fi
            BASE_SHA=$(git rev-parse origin/main)
            git rebase origin/main
            REBASED_HEAD=$(git rev-parse HEAD)
            if [[ "$REBASED_HEAD" != "$HEAD_SHA" ]]; then
              npm ci
              bash scripts/validate-ingest.sh
              test -z "$(git status --porcelain)"
              git push --force-with-lease="refs/heads/$BRANCH_NAME:$HEAD_SHA" origin "HEAD:refs/heads/$BRANCH_NAME"
              HEAD_SHA=$REBASED_HEAD
            fi
            if [[ $(git ls-remote origin refs/heads/main | cut -f1) != "$BASE_SHA" ]]; then
              continue
            fi
            if gh pr merge "$BRANCH_NAME" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA"; then
              exit 0
            fi
            # Retry only a moving base, not permissions or required-check failures.
            if [[ $(git ls-remote origin refs/heads/main | cut -f1) = "$BASE_SHA" ]]; then
              exit 1
            fi
          done
          echo "Main kept advancing; stopping after 3 attempts."
          exit 1
      - name: Deploy merged data to Pages
        if: steps.make-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Merges performed with GITHUB_TOKEN do not trigger push workflows.
        run: gh workflow run pages-deploy.yml --ref main
