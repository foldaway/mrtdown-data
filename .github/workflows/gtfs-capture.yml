name: Inspect public GTFS schedule capture

on:
  repository_dispatch:
    types: [gtfs_capture]
  workflow_dispatch:
    inputs:
      capture_key:
        description: Content-addressed schedule capture key
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.acquire.outputs.sha256 }}
      retrieved-at: ${{ steps.acquire.outputs.retrieved-at }}
      independent-outcome: ${{ steps.validate.outcome }}
      inspection-outcome: ${{ steps.report.outcome }}
      artifact-url: ${{ steps.artifact.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:cli
      - name: Acquire referenced snapshot
        id: acquire
        env:
          GTFS_SNAPSHOT_BASE_URL: ${{ vars.GTFS_SNAPSHOT_BASE_URL }}
          GTFS_CAPTURE_KEY: ${{ github.event.client_payload.capture_key || inputs.capture_key }}
          GTFS_INPUT_DIR: ${{ runner.temp }}/gtfs-input
        run: |
          node scripts/acquire-gtfs-capture.mjs
          jq -r '"sha256=\(.sha256)", "retrieved-at=\(.retrieved_at)"' \
            "$GTFS_INPUT_DIR/capture.json" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Acquire pinned independent validator
        run: |
          url=$(node -p "JSON.parse(require('fs').readFileSync('scripts/gtfs-validator-lock.json')).url")
          curl --fail --location --max-time 120 "$url" -o "$RUNNER_TEMP/gtfs-validator.jar"
      - name: Independently validate verified snapshot
        id: validate
        if: ${{ !cancelled() && steps.acquire.outcome == 'success' }}
        run: >-
          node scripts/validate-gtfs-independent.mjs
          "$RUNNER_TEMP/gtfs-validator.jar"
          "$RUNNER_TEMP/gtfs-input/schedule.zip"
          "$RUNNER_TEMP/gtfs-independent"
      - name: Inspect verified local snapshot
        id: report
        if: ${{ !cancelled() && steps.acquire.outcome == 'success' }}
        run: >-
          node packages/cli/dist/index.js gtfs inspect
          --file "$RUNNER_TEMP/gtfs-input/schedule.zip"
          --capture "$RUNNER_TEMP/gtfs-input/capture.json"
          --write "$RUNNER_TEMP/gtfs-report.json"
      - uses: actions/upload-artifact@v7
        id: artifact
        if: always()
        with:
          # Reruns keep their own reports and preserve links from earlier attempts.
          name: gtfs-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gtfs-report.json
            ${{ runner.temp }}/gtfs-independent/
          if-no-files-found: ignore

      - name: Build durable snapshot review
        id: review-report
        if: ${{ !cancelled() && steps.acquire.outcome == 'success' }}
        env:
          GTFS_SNAPSHOT_BASE_URL: ${{ vars.GTFS_SNAPSHOT_BASE_URL }}
          INDEPENDENT_OUTCOME: ${{ steps.validate.outcome }}
          INSPECTION_OUTCOME: ${{ steps.report.outcome }}
          REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: >-
          node scripts/build-gtfs-snapshot-review.mjs
          "$RUNNER_TEMP/gtfs-input"
          "$RUNNER_TEMP/gtfs-independent"
          "$RUNNER_TEMP/gtfs-review"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.review-report.outcome == 'success' }}
        with:
          name: gtfs-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gtfs-review/*.md
            ${{ runner.temp }}/gtfs-review/*.json
          if-no-files-found: error

  prepare:
    needs: inspect
    if: >-
      ${{ !cancelled() && needs.inspect.outputs.independent-outcome == 'success' &&
          needs.inspect.outputs.inspection-outcome == 'success' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages-deploy.yml
    with:
      prepare_only: true
      capture_key: ${{ github.event.client_payload.capture_key || inputs.capture_key }}
      validated_capture_sha256: ${{ needs.inspect.outputs.sha256 }}
    secrets: inherit

  review:
    needs: [inspect, prepare]
    if: >-
      ${{ !cancelled() && needs.inspect.outputs.sha256 != '' &&
          needs.prepare.outputs.decision != 'unchanged' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gtfs-review-${{ needs.inspect.outputs.sha256 }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: gtfs-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gtfs-review
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: gtfs-automatic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gtfs-automatic
      - name: Open snapshot review
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SNAPSHOT_ORIGIN: ${{ vars.GTFS_SNAPSHOT_BASE_URL }}
          SNAPSHOT_SHA256: ${{ needs.inspect.outputs.sha256 }}
          RETRIEVED_AT: ${{ needs.inspect.outputs.retrieved-at }}
          INDEPENDENT_OUTCOME: ${{ needs.inspect.outputs.independent-outcome }}
          INSPECTION_OUTCOME: ${{ needs.inspect.outputs.inspection-outcome }}
          ARTIFACT_URL: ${{ needs.inspect.outputs.artifact-url }}
          REVIEW_DIR: ${{ runner.temp }}/gtfs-review
          AUTOMATIC_REPORT: ${{ runner.temp }}/gtfs-automatic/automatic-publication.md
          AUTOMATIC_RESULT: ${{ needs.prepare.result }}
          PREPARED_ARTIFACT_ID: ${{ needs.prepare.outputs.prepared_artifact_id }}
        run: |
          review_branch="gtfs-review/$SNAPSHOT_SHA256"
          review_ref="refs/heads/$review_branch"
          existing_pr=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=all -f head="$GITHUB_REPOSITORY_OWNER:$review_branch" \
            --jq '.[0].html_url // empty')
          if [[ -n "$existing_pr" ]]; then
            if [[ "$(gh pr view "$existing_pr" --json state --jq .state)" != OPEN ]]; then
              echo "Snapshot review already closed at $existing_pr; retaining this run's decision in Actions"
              exit 0
            fi
          fi

          title="chore(gtfs): review schedule snapshot ${SNAPSHOT_SHA256:0:12}"
          record_path="docs/gtfs/captures/$SNAPSHOT_SHA256.md"
          body_path="$RUNNER_TEMP/gtfs-review-body.md"
          report_path="$RUNNER_TEMP/gtfs-review-report.md"
          # A previous attempt may have pushed the branch before PR creation failed.
          existing_ref=$(git ls-remote --refs origin "$review_ref")
          if [[ -z "$existing_ref" ]]; then
            run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            origin="${SNAPSHOT_ORIGIN%/}"
            mkdir -p docs/gtfs/captures
            if [[ -f "$REVIEW_DIR/$SNAPSHOT_SHA256.md" && -f "$REVIEW_DIR/$SNAPSHOT_SHA256.json" ]]; then
              cp "$REVIEW_DIR/$SNAPSHOT_SHA256.md" "$record_path"
              cp "$REVIEW_DIR/$SNAPSHOT_SHA256.json" "docs/gtfs/captures/$SNAPSHOT_SHA256.json"
            else
              cat > "$record_path" <<EOF
          # LTA train GTFS snapshot

          - Retrieved at $RETRIEVED_AT
          - ZIP SHA-256 \`$SNAPSHOT_SHA256\`
          - [Capture receipt]($origin/captures/schedule/$SNAPSHOT_SHA256.json) and [source ZIP]($origin/blobs/schedule/$SNAPSHOT_SHA256.zip)
          - Independent validator result \`$INDEPENDENT_OUTCOME\`
          - MRTDown inspection result \`$INSPECTION_OUTCOME\`
          - [GitHub Actions run]($run_url)

          **Comparison and findings summary unavailable:** review report generation or artifact transfer failed. Inspect the linked run and full reports before accepting this capture.

          This capture has no prepared publication request. Merging this record retains evidence only; publication requires the exception release procedure.
          EOF
              if [[ -n "$ARTIFACT_URL" ]]; then
                printf '%s\n' "- [Download available reports]($ARTIFACT_URL)" >> "$record_path"
              fi
            fi
            if [[ -f "$AUTOMATIC_REPORT" ]]; then
              printf '\n' >> "$record_path"
              cat "$AUTOMATIC_REPORT" >> "$record_path"
            fi
            git add -- "$record_path"
            if [[ -f "docs/gtfs/captures/$SNAPSHOT_SHA256.json" ]]; then
              git add -- "docs/gtfs/captures/$SNAPSHOT_SHA256.json"
            fi
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "$title" -m 'Co-Authored-By: Codex <noreply@openai.com>'
            git push --force-with-lease="$review_ref:" origin "HEAD:$review_ref"
          fi

          # Refresh the request on every preparation. A failed/held attempt removes
          # any previous request so merging cannot publish an obsolete candidate.
          cp scripts/gtfs-publication-review.mjs "$RUNNER_TEMP/gtfs-publication-review.mjs"
          cp scripts/gtfs-review-pr-body.mjs "$RUNNER_TEMP/gtfs-review-pr-body.mjs"
          git fetch origin "$review_ref"
          previous_commit=$(git rev-parse FETCH_HEAD)
          git checkout --detach "$previous_commit"
          request_path="docs/gtfs/captures/$SNAPSHOT_SHA256.publication.json"
          candidate="$RUNNER_TEMP/gtfs-automatic/publication-candidate.json"
          export PUBLICATION_READY=false
          if [[ -f "$candidate" && -n "$PREPARED_ARTIFACT_ID" && -f "$REVIEW_DIR/$SNAPSHOT_SHA256.md" && -f "$REVIEW_DIR/$SNAPSHOT_SHA256.json" ]]; then
            node "$RUNNER_TEMP/gtfs-publication-review.mjs" request "$candidate" "$request_path"
            git add -- "$request_path"
            export PUBLICATION_READY=true
          elif [[ -f "$request_path" ]]; then
            git rm -- "$request_path"
          fi
          if ! git diff --cached --quiet; then
            # Keep source evidence and replace only the current publication decision.
            node --input-type=module - "$record_path" <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = process.argv[2];
          let report = await readFile(path, 'utf8');
          report = report.split('\n## Publication approval\n')[0];
          report = report.split('\n## Automatic publication\n')[0];
          try { report += '\n' + await readFile(process.env.AUTOMATIC_REPORT, 'utf8'); }
          catch (error) { if (error.code !== 'ENOENT') throw error; }
          const ready = process.env.PUBLICATION_READY === 'true';
          report += ready
            ? '\n## Publication approval\n\nMerging this PR authorizes deployment of the exact prepared release in the adjacent publication request. Deployment rechecks its predecessor, source terms, service dates and content.\n'
            : '\n## Publication approval\n\nPublication is held. No prepared publication request remains; merging retains evidence only. Follow the exception release procedure.\n';
          await writeFile(path, report);
          NODE
            git add -- "$record_path"
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(gtfs): refresh prepared publication request" \
              -m 'Co-Authored-By: Codex <noreply@openai.com>'
            git push --force-with-lease="$review_ref:$previous_commit" origin "HEAD:$review_ref"
          fi

          # The PR body must describe the committed request and original source report.
          git fetch origin "$review_ref"
          git show "FETCH_HEAD:$record_path" > "$report_path"
          report_commit=$(git rev-parse FETCH_HEAD)
          report_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$report_commit/$record_path"
          if [[ -f "$AUTOMATIC_REPORT" && -z "$PREPARED_ARTIFACT_ID" ]]; then
            cp "$report_path" "$RUNNER_TEMP/committed-capture-report.md"
            cat "$AUTOMATIC_REPORT" > "$report_path"
            printf '\nPreparation workflow: **%s**. [Inspect this attempt](%s/%s/actions/runs/%s).\n\n' \
              "$AUTOMATIC_RESULT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$report_path"
            cat "$RUNNER_TEMP/committed-capture-report.md" >> "$report_path"
          fi
          node "$RUNNER_TEMP/gtfs-review-pr-body.mjs" "$report_path" "$report_url" > "$body_path"
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" --body-file "$body_path"
            exit 0
          fi

          gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" \
            --head "$review_branch" --title "$title" \
            --body-file "$body_path"
