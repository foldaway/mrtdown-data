# Build the static Pages bundle for preview branches without deploying it.

name: Build Pages Preview

on:
  pull_request:
    paths:
      - '.nvmrc'
      - '.github/workflows/pages-preview.yml'
      - 'LICENSE-DATA.md'
      - 'data/**'
      - 'releases/**'
      - 'scripts/gtfs-release-definition.mjs'
      - 'fixtures/data/**'
      - 'package*.json'
      - 'packages/**'
      - 'scripts/build-pages-artifact.mjs'
      - 'turbo.json'
  push:
    branches-ignore:
      - main
    paths:
      - '.nvmrc'
      - '.github/workflows/pages-preview.yml'
      - 'LICENSE-DATA.md'
      - 'data/**'
      - 'releases/**'
      - 'scripts/gtfs-release-definition.mjs'
      - 'fixtures/data/**'
      - 'package*.json'
      - 'packages/**'
      - 'scripts/build-pages-artifact.mjs'
      - 'turbo.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Pages artifact
        env:
          GTFS_SNAPSHOT_BASE_URL: ${{ vars.GTFS_SNAPSHOT_BASE_URL }}
        run: |
          if [[ -f releases/gtfs.json ]]; then
            npm run build:cli
            node scripts/gtfs-release-definition.mjs materialize releases/gtfs.json "$RUNNER_TEMP/gtfs-release"
            npm run pages:build -- \
              --gtfs-file "$RUNNER_TEMP/gtfs-release/schedule.zip" \
              --gtfs-capture "$RUNNER_TEMP/gtfs-release/capture.json" \
              --gtfs-combined-config "$RUNNER_TEMP/gtfs-release/combined-pages.json"
          else
            npm run pages:build
          fi

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: pages-preview-${{ github.run_id }}
          path: pages-dist
          if-no-files-found: error
          retention-days: 1
